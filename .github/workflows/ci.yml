name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The document gate walks origin/main..HEAD. A shallow clone has
          # neither, and the gate crashed on its own first run in the data
          # repository for exactly this reason (W-44). It degrades to
          # HEAD-only rather than crashing, but a narrower check that says so
          # is still narrower — give it the history it needs.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run forbidden volume literal guard
        run: npm run lint:forbidden
